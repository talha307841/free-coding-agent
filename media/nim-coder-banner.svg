<text x="450" y="206" font-family="monospace" font-size="9" fill="#00cc55" text-anchor="middle">TypeScript</text>
<rect x="488" y="194" width="52" height="16" rx="3" fill="#002410"/>
<text x="514" y="206" font-family="monospace" font-size="9" fill="#00cc55" text-anchor="middle">VS Code</text>
<rect x="548" y="194" width="42" height="16" rx="3" fill="#002410"/>
<text x="569" y="206" font-family="monospace" font-size="9" fill="#00cc55" text-anchor="middle">MIT</text>
<rect x="598" y="194" width="44" height="16" rx="3" fill="#002410"/>
<text x="620" y="206" font-family="monospace" font-size="9" fill="#00cc55" text-anchor="middle">v1.0.0</text>

<rect x="0" y="0" width="2" height="220" fill="#00ff6a" opacity=".5"/>
<rect x="678" y="0" width="2" height="220" fill="#00ff6a" opacity=".5"/>
<rect x="0" y="0" width="680" height="2" fill="#00ff6a" opacity=".3"/>
