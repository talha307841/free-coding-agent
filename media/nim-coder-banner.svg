<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>NIM Coder - AI coding agent banner</title>
<desc>Dark terminal-style banner with code rain animation, NIM Coder title and workflow tagline</desc>
<defs>
<style>
@keyframes fall0{0%{opacity:0;transform:translateY(-20px)}10%{opacity:.7}80%{opacity:.4}100%{opacity:0;transform:translateY(200px)}}
@keyframes fall1{0%{opacity:0;transform:translateY(-40px)}15%{opacity:.5}75%{opacity:.3}100%{opacity:0;transform:translateY(200px)}}
@keyframes fall2{0%{opacity:0;transform:translateY(-10px)}20%{opacity:.6}70%{opacity:.2}100%{opacity:0;transform:translateY(200px)}}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.5}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.col0{animation:fall0 3.1s infinite linear;animation-delay:0s}
.col1{animation:fall1 2.8s infinite linear;animation-delay:.4s}
.col2{animation:fall0 3.4s infinite linear;animation-delay:.9s}
.col3{animation:fall2 2.6s infinite linear;animation-delay:.2s}
.col4{animation:fall1 3.2s infinite linear;animation-delay:1.1s}
.col5{animation:fall0 2.9s infinite linear;animation-delay:.6s}
.col6{animation:fall2 3.5s infinite linear;animation-delay:1.4s}
.col7{animation:fall1 2.7s infinite linear;animation-delay:.3s}
.col8{animation:fall0 3.3s infinite linear;animation-delay:.8s}
.col9{animation:fall2 3.0s infinite linear;animation-delay:1.6s}
.col10{animation:fall1 2.5s infinite linear;animation-delay:.1s}
.col11{animation:fall0 3.6s infinite linear;animation-delay:1.2s}
.brand{animation:pulse 3s ease-in-out infinite}
.cur{animation:blink 1.1s step-end infinite}
</style>
</defs>

<rect width="680" height="220" fill="#0a0e0c"/>
<rect width="680" height="220" fill="#051a10" opacity=".6"/>

<text class="col0" x="22" y="20" font-family="monospace" font-size="11" fill="#00ff6a" opacity=".0">async<tspan x="22" dy="14">await</tspan><tspan x="22" dy="14">const</tspan><tspan x="22" dy="14">class</tspan><tspan x="22" dy="14">def</tspan><tspan x="22" dy="14">fn()</tspan><tspan x="22" dy="14">{}</tspan><tspan x="22" dy="14">[]</tspan></text>
<text class="col1" x="62" y="10" font-family="monospace" font-size="11" fill="#00cc55" opacity=".0">import<tspan x="62" dy="14">from</tspan><tspan x="62" dy="14">return</tspan><tspan x="62" dy="14">yield</tspan><tspan x="62" dy="14">type</tspan><tspan x="62" dy="14">impl</tspan><tspan x="62" dy="14">pub</tspan></text>
<text class="col2" x="108" y="30" font-family="monospace" font-size="11" fill="#00ff6a" opacity=".0">grep<tspan x="108" dy="14">diff</tspan><tspan x="108" dy="14">patch</tspan><tspan x="108" dy="14">git</tspan><tspan x="108" dy="14">log</tspan><tspan x="108" dy="14">HEAD</tspan></text>
<text class="col3" x="152" y="0" font-family="monospace" font-size="11" fill="#00aa44" opacity=".0">0x1f<tspan x="152" dy="14">0xff</tspan><tspan x="152" dy="14">null</tspan><tspan x="152" dy="14">true</tspan><tspan x="152" dy="14">enum</tspan><tspan x="152" dy="14">mut</tspan><tspan x="152" dy="14">ref</tspan></text>
<text class="col4" x="196" y="15" font-family="monospace" font-size="11" fill="#00ff6a" opacity=".0">while<tspan x="196" dy="14">loop</tspan><tspan x="196" dy="14">match</tspan><tspan x="196" dy="14">break</tspan><tspan x="196" dy="14">try</tspan><tspan x="196" dy="14">catch</tspan></text>
<text class="col10" x="240" y="0" font-family="monospace" font-size="11" fill="#00ff6a" opacity=".0">-46<tspan x="240" dy="14">+12</tspan><tspan x="240" dy="14">@@</tspan><tspan x="240" dy="14">---</tspan><tspan x="240" dy="14">+++</tspan></text>

<text class="col5" x="480" y="25" font-family="monospace" font-size="11" fill="#00cc55" opacity=".0">struct<tspan x="480" dy="14">trait</tspan><tspan x="480" dy="14">impl</tspan><tspan x="480" dy="14">where</tspan><tspan x="480" dy="14">self</tspan><tspan x="480" dy="14">super</tspan></text>
<text class="col11" x="440" y="18" font-family="monospace" font-size="11" fill="#00aa44" opacity=".0">error<tspan x="440" dy="14">warn</tspan><tspan x="440" dy="14">info</tspan><tspan x="440" dy="14">debug</tspan><tspan x="440" dy="14">trace</tspan></text>
<text class="col6" x="524" y="5" font-family="monospace" font-size="11" fill="#00ff6a" opacity=".0">raise<tspan x="524" dy="14">pass</tspan><tspan x="524" dy="14">with</tspan><tspan x="524" dy="14">lambda</tspan><tspan x="524" dy="14">None</tspan></text>
<text class="col7" x="568" y="35" font-family="monospace" font-size="11" fill="#00aa44" opacity=".0">Vec&lt;T&gt;<tspan x="568" dy="14">Box&lt;T&gt;</tspan><tspan x="568" dy="14">Option</tspan><tspan x="568" dy="14">Result</tspan></text>
<text class="col8" x="612" y="10" font-family="monospace" font-size="11" fill="#00ff6a" opacity=".0">spawn<tspan x="612" dy="14">async</tspan><tspan x="612" dy="14">send</tspan><tspan x="612" dy="14">sync</tspan><tspan x="612" dy="14">arc</tspan></text>
<text class="col9" x="648" y="20" font-family="monospace" font-size="11" fill="#00cc55" opacity=".0">===<tspan x="648" dy="14">!==</tspan><tspan x="648" dy="14">=&gt;</tspan><tspan x="648" dy="14">::</tspan><tspan x="648" dy="14">??</tspan></text>

<rect x="0" y="55" width="680" height="110" fill="#0a0e0c" opacity=".82"/>
<rect x="39" y="86" width="3" height="46" fill="#00ff6a" rx="1"/>

<text x="58" y="119" font-family="monospace" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-1">NIM<tspan fill="#00ff6a"> Coder</tspan></text>
<text class="cur" x="342" y="119" font-family="monospace" font-size="38" font-weight="700" fill="#00ff6a">_</text>

<text x="58" y="144" font-family="monospace" font-size="13" fill="#4dff99" letter-spacing=".5">plan -&gt; confirm -&gt; diff -&gt; accept -&gt; ship</text>

<rect x="0" y="183" width="680" height="37" fill="#0a0e0c" opacity=".92"/>
<text x="40" y="206" font-family="monospace" font-size="11" fill="#1a6b3a">// AI coding agent - full human review - zero surprises</text>

